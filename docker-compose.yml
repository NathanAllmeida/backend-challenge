x-app: &app
  build: .
  restart: unless-stopped
  environment: &app-env
    DATABASE_HOST: postgres
    DATABASE_PORT: 5432
    DATABASE_USER: wallet
    DATABASE_PASSWORD: wallet
    DATABASE_NAME: wallet
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    SQS_ENDPOINT: http://localstack:4566
    WORKERS_ENABLED: "true"
  depends_on:
    setup:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 3s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"\(available\|running\)\"'"]
      interval: 3s
      timeout: 3s
      retries: 30

  setup:
    build: .
    environment:
      <<: *app-env
    command: ["sh", "-c", "bun run migration:up && bun run queues:setup"]
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  app-1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-1
    ports:
      - "3001:3000"

  app-2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-2
    ports:
      - "3002:3000"

  app-3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-3
    ports:
      - "3003:3000"

volumes:
  postgres-data:
